# Balanceo de carga: `api` es el nombre del servicio en Docker. Docker lo resuelve a la IP de CADA
# réplica y Nginx reparte las peticiones entre todas (least_conn = va a la que tenga menos conexiones).
upstream taskflow_api {
    least_conn;
    server api:3000;
    keepalive 16;
}

server {
    listen 80;
    server_tokens off; # no revela la versión de Nginx
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La API: se reenvía a una de las instancias.
    location /api/ {
        proxy_pass http://taskflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503; # si una instancia cae, prueba con otra
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        # Qué instancia atendió la petición (útil para ver el balanceo y para las pruebas de carga).
        add_header X-Upstream $upstream_addr always;
        include /etc/nginx/security-headers.conf;
    }

    # Archivos compilados (su nombre cambia con cada versión): se pueden guardar un año.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Cualquier otra ruta es de React Router: se entrega index.html y la app decide qué pantalla mostrar.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
