# Cabeceras de seguridad de la página. Se incluye en cada location que usa add_header
# (en Nginx, un add_header dentro de un location anula los del nivel superior).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Solo se carga código y estilos del propio sitio. 'unsafe-inline' en estilos es necesario para los
# anchos de las barras del dashboard (atributos style).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
